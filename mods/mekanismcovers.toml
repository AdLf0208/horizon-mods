sha256 = "ff66815e65f539bee99fe4b1d85d4b6fb9fa65ce695df7b9c78711d2c966b362"
changelog = """This version answers a review, and the defect was a data-loss bug in a crafting grid. A cover was filled by consuming whatever block item was offered and storing only its block id, and stripping the cover returned a fresh stack of that id, so filling a cover from a shulker box destroyed the box's contents. The rule now refuses before anything is consumed: a block that has a block entity, a stack carrying any component, or a cover that carries anything besides its own block key produces no result at all. The pure rule and the recipe share one predicate, so a refusal can never be a recipe that matched and then declined to consume. Proven in game with three cases in one table: a filled shulker box gives no result and keeps its contents, a named stone is refused the same way and stays untouched, and a plain stone in the same screen still fills exactly one cover and consumes exactly one stone — that last case is what shows the refusal belongs to the stack rather than to a broken screen. Clicking a filled shulker box on a cable applies no cover and leaves it in hand. The archive also carries the original author's credit and the MPL text, which the listing now names as well.
"""
