sha256 = "8387f865ed975963a9b7bd5b1d1d602434977c43a288dc0399e4cdbf962ad9b6"
changelog = """Slice 7, the creative generator: the one block in this package whose whole purpose is the energy capability the relay and the lamp deliberately do not have. It stores and offers the largest number the type can hold, gives without limit and takes nothing, and its own tick additionally offers that maximum to every neighbour so a large sink caps it rather than the source. Proven in game on the game's clock: a connector mounted on it settles into pull, a wire drains exactly one thousand energy a tick so the sink gains twenty thousand over twenty ticks after the window has filled, and the direct pair moves five thousand a tick; putting stone where the generator goes leaves the sink at zero for thirty-one ticks, which is the differential. The second build check stays red for the reason the lamp established two slices ago, that the light emission surface is absent from that older build, and this block adds no new API of its own. Its model named another mod's textures, so two deterministic textures are generated rather than copied.
"""

[[versions]]
version = "0.2.6"
published = "2026-11-23"
game = "26.3"
file = "createaddition.hmod"
sha256 = "9daebe6da2536041f42f76e2b7f169ee2d243ae60fbbc0312f719508b6e756f4"
changelog = """Slice 6, the modular accumulator's comparator output: the tower now answers a comparator with a strength that follows how full it is, read from the tower's pooled fill rather than from the block the comparator touches. The mapping is the reference's own and it is not the obvious one: the fraction is multiplied by fourteen and one is added when it is above zero, so a half-full tower reads eight rather than seven, and a run that only checked empty and full would pass while the middle was wrong. The game leg therefore asserts the middle value explicitly — empty reads zero, three of six million reads eight, full reads fifteen, the same rig behind stone reads zero, and emptying the tower returns it to zero. The fraction is computed in single precision because the reference does, which is the kind of difference that only shows at a boundary. One thing the port had already measured is worth repeating here: the second build check stays red because the light emission surface this package needs does not exist in that older build, and the comparator adds no new surface of its own.
"""

[[versions]]
version = "0.2.5"
published = "2026-11-22"
game = "26.3"
file = "createaddition.hmod"
sha256 = "854e9d6ac9a8b9af0501310053c8e9c833215694663959501447a15199372b41"
changelog = """Slice 5, the small light connector: the lamp variant of the small connector, which draws one FE a tick from its network and lights after a period that depends on where it stands, then darkens just as slowly when the energy stops. The period is the reference's own hash of the block's position, ten to twenty-eight ticks, and the counter clamps, so a lamp that has gone dark needs twice its period of energy before it lights again — the game leg waits that long and says why, rather than pretending the first figure was wrong. Proven in game with the numbers: at no energy the lamp is unpowered and its emitted light reads zero; seeded with five thousand and linked it is powered, its light reads fifteen, and the source falls forty-two FE over forty-two ticks, exactly one a tick, with the source, the pool and the lamp's draw adding up. Unlinked, it darkens and the source stops falling. This is also the first slice whose second build check is red, and that is the honest result: the light emission handle this family needs does not exist in the older build, so the pin run is not a tautology. Recorded in the notes for whoever repins next.
"""

