changelog = """Slice 4, the redstone relay: a wire block that passes energy only while it has a redstone signal, with two separate ports so the input pool and the output pool are different networks rather than one, and a thousand FE of in-flight energy that is conserved across the gap. The gate is what the slice is about: unpowered, nothing crosses and the sink stays exactly where it was; powered, twenty-four thousand and twenty FE arrive and the books balance to the last FE, with the block's own `powered` state read back before and after the redstone block is placed. The reference has no energy capability on this block, so none was declared here either — declaring one would let a neighbour bypass the gate entirely, and that is recorded as a deviation from our brief rather than from the mod. A selftest that trips the conservation assertion fails, and a second one that flips the gate fails on its own, so the two claims are independent. One harness defect is recorded with the fix: a local variable shadowed the readout's field name through bash's dynamic scoping, which made a restore branch never run and produced a false no-movement reading."""

