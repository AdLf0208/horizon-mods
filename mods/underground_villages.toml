id = "underground_villages"
kind = "mod"
name = "Underground Villages Mod"
summary = "A Horizon port of underground_villages."
description = """
A port of [underground_villages](https://github.com/Mrbysco/UndergroundVillages) by Mrbysco.

A first port of Underground Villages for Horizon 26.3, carrying the retired port's 153 worldgen files as one flat content `.hmod`: one jigsaw structure, a random-spread set, 17 template pools, a processor list, 3 vanilla placed features, 2 tags and 128 NBT templates. The tool rewrites the three chain cells to iron_chain for 26.3 and verifies every other template byte-identical to the jar. Proven in game: `/locate` and `place structure` generate the village, and block reads at the generated position find cut copper stairs, cyan terracotta and black stained glass panes that a control chunk has none of; 12 villagers spawn versus zero in the control, and an unknown id is refused. The mod's Java height-provider type and config surface are absent at this pin and are recorded as blocked, so the carried data uses the same vanilla constant at y = -20.
"""
