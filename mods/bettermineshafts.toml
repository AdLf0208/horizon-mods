description = """
A Horizon port of YUNG's Better Mineshafts 1.21.1-NeoForge-5.1.1: the mod's own mineshaft geometry, generated in Rust behind an SDK structure type. The jar has no structure templates at all — its mineshaft is a Java structure type that builds its pieces in code — so this port carries the thirteen structure definitions with their per-variant palettes and writes the geometry itself. Upstream: https://github.com/YUNG-GANG/YUNGs-Better-Mineshafts — licence **LGPL-3.0-only**.

**Implemented so far**

- The thirteen structure definitions (`mineshaft_oak` through `_spruce_snowy`) and the structure set (`random_spread`, salt 593751784, spacing 1, separation 0, `legacy_type_3`, frequency 0.003) are carried with the jar's biomes, step, spawn overrides and per-variant config in 26.3's shape, and the thirteen biome tags, two structure tags and three lang files are byte-identical to the jar's.
- The structure type `bettermineshafts:mineshaft` is written in Rust, so the structure generates its own geometry instead of being an unsupported type.
- A vertical entrance (5×5 shaft, ladder, stone-brick doorway, legs) and a 9×8×24 main corridor (planks and a randomized floor, fence supports, rails and powered rails, hanging lanterns, gravel, cobwebs, vines) are written by the port's own piece writers.
- 5×5×8 branch corridors run off the side walls, 10×5×5 workstation rooms carry iron bars and a crafting table, and all thirteen variants build from their own carried palette read from the structure's config.
- `/bettermineshafts status` prints the structure, its required and optional biomes and a deterministic probe's piece count.
- An upstream defect is fixed: the start height is drawn once instead of twice, so the recorded start and the shaft's floor agree.
- The package was proven in game at 0.2.1: `/place structure` writes the entrance's ladder, the corridor's rails, the doorway's bricks and the walls' planks, the ice variant builds from `packed_ice`, and a control run fails without the package.

**Not yet ported**

- Six of the ten piece kinds are missing — stairs, turns, layered intersections 4/5, ore deposits, zombie-villager rooms and side-room dungeons — because this slice prefers a small faithful vocabulary to invented geometry.
- The terrain-driven surface tunnel is not built, because it samples the surface ring and picks a direction and length at generation time; this slice builds the shaft half only.
- Biome decorations (snow, lush, dripstone, cactus, dead bush, mushroom) are not placed, because the piece context has neither a biome nor configured features.
- The corridor's edge and inner leg patterns are not written, and `legVariant` is parsed, saved and reloaded but changes nothing in the writers yet.
- Minecarts, chests, furnaces and barrels are not added, because they need block-entity payloads rather than a state write; the piece context can now express them, so this is next-slice work rather than an API gap.
- Vanilla mineshafts still generate beside this mod's, because upstream turns them off with a mixin and the pin has no hook to disable a vanilla structure.
- A palette block outside the port's fixed 76-name table makes that structure's start unavailable, because the only name-to-key route is registration-time.
- The locate command mixin, the Java config file and YUNG's API placement helpers are not carried, and another mod's explorer-map tag stays outside the package because it is that mod's namespace.
- The in-game scenario proves the entrance, the corridor, the doorway and two palettes, but does not yet inspect a branch corridor or a workstation room block by block.

Ported from the upstream mod and published under LGPL-3.0-only with its complete corresponding source and the original copyright notice; `LICENSE-NOTICE.md` records where the licence was read.

Pinned to Horizon 0b14f8a and horizon-mixins e59da90.
"""
