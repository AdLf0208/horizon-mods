published = "2026-11-23"
game = "26.3"
file = "simplebackups.hmod"
sha256 = "f7a25eaef989cda98400e5f9eb7a44cacfe58c2f0b40cb8c27c30b2b824733c5"
changelog = """This version answers four findings, and two of them were data loss waiting to happen. An archive that does not carry this port's own marker is no longer deletable by shape alone, because a hand-made export has the same shape as a real backup: an operator now adopts that exact file with a command, and the adoption records its size so replacing the file under the same name drops it out again. A second backup written in the same second is allocated above the highest suffix instead of reusing a pruned one, and the archive a run has just written is protected from both of its own retention passes, so it can never sort behind an older backup and be deleted immediately. A filename with a multibyte character across the timestamp boundary used to panic on the server tick; the parse now refuses it instead. Proven in game on each: a manual export survives retention, is adopted, and is then pruned by the next publish; two archives of one second both survive with the newer keeping its suffix; and the stale-copy rule from the previous version still holds.
"""

