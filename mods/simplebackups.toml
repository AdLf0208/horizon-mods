sha256 = "53a767bb1c2a55915391ea69630fd4f36bad5a30ec8727bac820e2ad8bb31606"
changelog = """This version captures the game log in each backup, so the archive carries the exact messages from the run that produced it. The hard part was the path: the mod's config API cannot name a file outside config, so the glue derives candidates from both host roots and refuses symlinks and traversal, with the headless launcher's log location measured before any code. Proven by opening the newest archive with zipfile and finding a concrete line from that scratch latest.log inside backup.log; with capture off the entry is absent, and the inverted assertion ends exit one. A collapsible branch and three needless clones found by clippy were fixed rather than allowed."""

[[versions]]
version = "0.2.8"
published = "2026-11-24"
game = "26.3"
file = "simplebackups.hmod"
sha256 = "843d9fd8ba3aba26ba0f03e3fe9b295dc30efa182afa75e19466e94a39ebb117"
changelog = """This version adds the empty-server policy, so a server with nobody online can be capped at a configured number of scheduled backups per empty period. The rule is read from upstream: no player online means an empty player list, the counter is per empty period and resets when somebody joins, and a count of zero disables it. The harness cannot produce a genuinely playerless interval — launching places the world owner and disconnecting needs a remote server — so the empty branch is proved red-first by unit tests rather than by dressing a chat command up as an empty server. The game leg proves the still-populated path is unchanged, with a per-period counter in the parsed status."""

[[versions]]
version = "0.2.7"
published = "2026-11-24"
game = "26.3"
file = "simplebackups.hmod"
sha256 = "f02f1aa1786e5b0d141ec4bed2e94535498a60c4bc600e4dc1a2a4af595f9656"
changelog = """This version adds incremental backups, closing the chains half of the last coverage gap. The chain format comes from the reference: a flat archive's manifest names its base, kind, changed entries and length, thresholds persist beside the world, and a child includes a file only when its modification time is strictly newer than the saved threshold. A defect surfaced while proving it — the threshold was advanced at the current backup's start, so a child compared against its own time and missed the changed file; moving the write to after plan computation fixed it. Proven across a full chain: base then changed-only child, chain two, both named by list, merge, and a fresh world still starting at chain one. Regex ignores stay unported because a faithful pattern needs a crate the registry refuses."""

[[versions]]
version = "0.2.6"
published = "2026-11-24"
game = "26.3"
file = "simplebackups.hmod"
sha256 = "a2261c76ce1f2e6df592262279df92573a9cecceb687f1624f1f44d260294c09"
changelog = """This version makes the backup interval survive a restart. The counter is written beside the world as one exact line on every save checkpoint and graceful close, with a staged rename so a crash cannot leave a half-written value, and read back when the world opens — the same moment the reference loads its saved data. Proven across a quit and relaunch of the same world: a seeded count of ten resumes to twenty-eight, an empty window passes without a zip, and the next interval produces exactly one fresh archive; a world with no state file still waits the full interval. The regex half of the same gap stays open, because adding a crate would be refused by the registry now."""

[[versions]]
version = "0.2.5"
published = "2026-11-24"
game = "26.3"
file = "simplebackups.hmod"
sha256 = "13fb3e0a397b1ecd8232ed338f1dc986c82770f6bc09055cedf7fca714b0e16b"
changelog = """This version adds pause and unpause, and the pause flag survives a restart because the reference stores it in the world's saved data rather than in memory. Only the scheduled backups are suppressed: a manual backup still runs while paused, which is the distinction that matters. Proven across a real schedule: one zip, pause, a hundred and fifty ticks with no new zip, a manual backup that still makes one, then unpause and exactly one fresh zip named by the listing. The inverted assertion fails at the paused window, so the leg cannot pass by reading a stale line. One earlier run failed on my own check, which matched an old status line from a twenty-message buffer; the check now parses only the newest reply."""

