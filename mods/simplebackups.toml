changelog = """This version fixes retention, which had one root cause behind two data-loss defects: it treated anything named like a backup as one, and it ran unconditionally after every publish. Now every archive carries a manifest written into it, and only an archive whose format and world both match is this world's, with older archives recognised by their world-zip shape so an upgrade orphans nothing; a hand-made file with the same name, or one made for another world, is never deleted. Retention also skips both passes after a stale copy, and same-second generations sort numerically rather than as text, which is what had been keeping the wrong nine. Proven in game with the differential in the same folder: a hand-made zip survives the cap while a mod-made archive of the same name pattern and age is removed, and a stale run leaves two archives and the clean restore point while reporting that the cap was skipped. The negative runs assert the pre-fix behaviour so neither claim can pass by accident.
"""

