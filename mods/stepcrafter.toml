changelog = """
This version answers a review, and both defects were real. The machine planned against the stock's total rather than against the room its table actually had, so it could consume ingredients and place nothing, and the requester then counted the step as served; a held result is now committed only when the whole of it fits the slots that remain after the ingredients leave, otherwise the ingredients stay and the step is refused as a full network. Proven in game with the exact case: twenty-six stacks of coal and sixty sticks leave an aggregate of seven hundred and twenty-eight against a limit of seventeen hundred and twenty-four, yet no slot can take four torches, so the crafter reads stored zero and phase network-full with its stock untouched. Taking items out used to rebuild each stack from an id, which lost names, enchantments and damage; it now hands over the stored stacks themselves, split to the count asked for, and the game leg proves a named pair and a damaged sword coming out intact. The archive also carries the upstream notice byte for byte, which the review asked for, and the packaged readme is current.
"""
