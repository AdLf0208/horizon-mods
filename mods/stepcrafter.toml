id = "stepcrafter"
kind = "native-mod"
name = "stepcrafter"
summary = "A Horizon port of stepcrafter."
description = """
The first port of Step Crafter, and it opens with the family the mod exists for: a machine that keeps a stock of one target item inside a minimum and maximum band by crafting one step at a time from its own inventory. Set the target and the band, load the ingredients, and it crafts until the maximum and then holds rather than overshooting; empty one ingredient and it reports not enough ingredients and resumes when the stock returns. Proven in game across a full band and a half one: a zero to sixteen run in steps of four consumes exactly four coal and four sticks and holds over sixty more ticks, taking eight torches moves them to the inventory, and a sixty-four to one-hundred-and-twenty-eight band fills to one hundred and twenty-eight with the active state reading true while running and false when idle. A survival break drops the machine and spills its eight torches, a non-operator is refused, and the carried recipe crafts with its ingredients consumed while a wrong grid makes nothing. Two things were only visible in game and are recorded rather than hidden: a stock kept in the block entity's own saved compound was lost between ticks, so it moved to a container the engine owns, and a moved machine must be re-targeted because a container block lets the engine spill rather than carrying a payload. The parts that need the parent's autocrafting network are recorded as blocked with their symbols instead of being shipped inert.
"""
authors = ["AdLf0208"]
owners = ["AdLf0208"]
owner_ids = [107615167]
license = "MIT"
source = "https://github.com/AdLf0208/stepcrafter"
icon = "icons/stepcrafter.png"
categories = ["utility"]
tags = ["port", "horizon"]

[[versions]]
version = "0.2.1"
published = "2026-11-22"
game = "26.3"
file = "stepcrafter.hmod"
sha256 = "b40307c5ddf08c4ea9f7d6e358248dff1d27c5774b41e46eabcbcca6cdc6de63"
changelog = """Slice 2, the Step Requester: a block that watches a stock and asks a nearby machine to craft more when the stock falls below a minimum, batching up to a maximum, so the machine's own band no longer has to be set by hand. The rule is the reference's own hysteresis with the network replaced by the nearest machine within four blocks that maintains the same item, and the request is one integer written into that machine's saved data which its own tick spends one step at a time. The question our brief flagged as a possible blocker is answered by measurement: world-state interop between two blocks works at this pin, with one block reading another's slots and saved values and writing a single value that the other's next tick sees, so nothing had to be recorded as blocked. Proven in game on the same world twice: with the requester present the machine reaches a stored and crafted count of eight on two coal and two sticks, and with the requester removed the identical machine sits at zero and zero. An ingredient shortage reads as not enough ingredients with a backoff, and the restock resumes both machines to eight. The managers and monitor stay recorded as blocked, because they mix into a screen the parent port does not ship."""

