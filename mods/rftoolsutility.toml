file = "rftoolsutility.hmod"
sha256 = "7a13f87dcf1804dfee0d72971a02603ad2611deb060dd3f59b71d0be20fae612"
changelog = """This version adds the environmental controller with its first module. The effect surfaces were measured as stamped before any code — entity lookup, effect key, living effect reads and writes — so no effect command was invented. The artefact's volume and RF formulas were carried, including its default volume of three hundred and twenty-two thousand rather than a naive circle area. Proven in game by a parsed readout showing regeneration at amplifier zero with the energy falling by exactly the displayed rate over the replies' own tick window, while no-power, disabled, out-of-radius and no-module cases all read no effect. Two load-time defects found on the first run were fixed at the root."""

[[versions]]
version = "0.2.18"
published = "2026-11-24"
game = "26.3"
file = "rftoolsutility.hmod"
sha256 = "cb690fab949b3c4fb2f0353324f9687b62ea20aa4365ddb7157141d2a299d0fd"
changelog = """This version adds the logic wire, the last expressible logic-family sibling. The block gate passed — it is a directional signal relay with no cross-block network table. The two directional conventions had to be mapped in game: the pin's signal read uses vanilla's backwards direction while the block-signal event's face is consumer-facing, so the artefact's input-side test becomes a comparison with the opposite face. Proven by a six-wire run lighting a far lamp, a broken link leaving it dark, and a lone-wire directional differential. The loop guard stops reentrant propagation. One hundred and eighteen strict e2e logs stay green."""

[[versions]]
version = "0.2.17"
published = "2026-11-24"
game = "26.3"
file = "rftoolsutility.hmod"
sha256 = "224a3fbba5a7d93c4cbef0e8b2ef73495c9a588bd036c0e7a3985ee8245b5684"
changelog = """This version adds the redstone transmitter and receiver pair. The artefact's world-saved channel table is persisted through the pin's world-data-files surface — the same path other ports use — so a written strength survives a real relaunch; no chat-command stand-in. Read from the artefact: a fresh channel is minus one, the transmitter writes only on a changed input, and a digital receiver collapses any positive value to fifteen while an analog one preserves the exact strength. Proven in game by a fed transmitter lighting a lamp on channel one while channel two stays dark, a five-wire analog run preserving eleven, and the value still reading eleven after relaunch. The inverted self-test exits one."""

[[versions]]
version = "0.2.16"
