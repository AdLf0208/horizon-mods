sha256 = "209077df6d5fedf5aa1d7eedb15b9b01635e73ad8036f91cf8a47c33153b057b"
changelog = """This version adds the analog redstone computer. With the reference's identity defaults it passes the input level through; otherwise it truncates floor(input times the multiplier, plus the addend) for the equal, less and greater branches and clamps to zero through fifteen, waking neighbours only on a change. The six GUI-only fields are set by command, the established stand-in. Proven from game-time stamps: 15 at multiplier one-half truncates to seven, identity returns fifteen, and the zero-input and equal-multiplier-zero cases give zero; a negative result clamps. Digit is not carried — its tile has no redstone output at all, only a client renderer, so there is no fail-capable lamp assertion to make. The earlier sensor, sequencer, timer and counter legs stay green."""

[[versions]]
version = "0.2.13"
published = "2026-11-24"
game = "26.3"
file = "rftoolsutility.hmod"
sha256 = "b82e87029d1f98349c125339021d923dabf467a52719911e3dda20941f885e41"
changelog = """This version adds the counter, which counts rising redstone edges and lights an output on the configured limit. The reference only writes the output inside the pulse branch, so the fifteen is a level latch that stays until the **next** rising edge clears it and resets the count; a held input is never counted twice. Proven from the replies' own game-time stamps with a limit of four: the fourth pulse lights the lamp, the next pulse clears it, and a no-pulse window leaves the output untouched. GUI-only fields are set by command, recorded as a deviation; the input is sampled from the input-side neighbour rather than the block's own emitted signal."""

