changelog = """Slice 7, the spawner's matter gate: a spawn now needs three matter amounts as well as its energy, and it spends each by its own amount. Our brief called for three fluid tanks and the artefact says otherwise: the reference stores three floats in the machine's own data, filled by a beamer that sends an item rather than a fluid, and there is no fluid anywhere in that module. So the port keeps the three floats, and a command writes what a beamer's send would add, which is provenance rather than an API gap — the pin can declare fluids, it is simply not what this machine does, and inventing them would have let pipes feed a spawner that upstream cannot feed. Proven in game with a three-step differential on the same machine: eight hundred FE and empty stores spawn nothing and spend nothing; stores a hair short of the recipe spawn nothing and keep both their energy and their matter; exactly enough spawns one zombie and leaves the energy at zero with all three stores emptied. A second spawn spends each store by its own amount and leaves the remainder, changing the mob clears the stores, the broken item carries them, and the unfed twin in the other dimension keeps its zeros."""

