changelog = """Slice 5, the storage scanner: a block that reads the inventories inside a cube around it and answers one command with what it found, charging its own energy for the question and refusing when it has none. The radius is settable because the reference exposes it as a slider, so here it is a command that clamps to the same bounds. Proven in game as a sequence of exact answers: a fresh scanner with no power says so with its buffer in the reply; at the default radius it sees nothing because the chest is two blocks away and reports its charge falling; at radius two it finds sixty-four stone and no dirt; at radius three it finds the dirt too, each answer costing the same fixed charge; with the buffer emptied it refuses and reads nothing, and recharging makes it answer again. A chest and a modular storage both answer that they are not scanners, the buffer and radius and answer all survive a relaunch, and a survival break drops the block itself. Two honest restrictions are recorded rather than worked around: the scanner's recipe needs a machine frame from a sibling port that is pinned at an older build and so cannot share this game, and the claimed-land check is blocked because the pin exposes a cancellable destroy hook rather than a permission query."""

