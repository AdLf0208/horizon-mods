version = "0.2.16"
published = "2026-11-23"
game = "26.3"
file = "rftoolsstorage.hmod"
sha256 = "68620ecd44b0b2a5422db08185daa6898bb2eeb534dc47fd44ad7656e1427f16"
changelog = """
This version closes a security hole rather than a cosmetic one: the storage scanner could reach into any container in its radius, including another player's, with the only check being that the caller was an operator or within eight blocks of the machine. Now the scanner belongs to whoever placed it, and a caller who is neither that player nor an operator is refused; and every target must agree to be touched, which the engine answers for a player's reach and the container itself answers for a lock. A locked container is closed to the scanner, and a refusal is reported as a plain non-inventory rather than disclosing what is behind it. Delivery is one transaction priced by what was actually delivered, so a refused hand or output slot refunds both the items and the charge. Proven in game against the very package this replaces: a locked chest is hidden from the scan and from both content readouts, cannot be starred or pulled from, is routed past on insert, and appears again the moment its lock is removed — which is the differential. Two limits are stated rather than hidden: the scanner's owner check is proved by unit test because this harness has only the host identity, and a locked cell is refused even for the player holding its key, since the scanner presents no hand to match.
"""

