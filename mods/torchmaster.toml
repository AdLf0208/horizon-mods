file = "torchmaster.hmod"
sha256 = "89fe9162ee4d00238dad2745729cbf0f0a0b21dc696742219a832191312b3b19"
changelog = """This version vetoes phantom spawns near a mega torch. The artefact's stamped player_spawn_phantoms hook is a replace contract, so the veto is a Deny result rather than an invented cancel flag; the range is the mega torch's sixty-four blocks and only monsters match. Proven in game by an insomniac player under an open sky growing four phantoms unaided and none across two spawn windows with a torch ten blocks away, with a type-filtered count and a seeded player-stats fixture so the owner's random UUID cannot break it. The inverted self-test exits one. Village sieges remain the companion family."""

[[versions]]
version = "0.2.5"
published = "2026-11-24"
game = "26.3"
file = "torchmaster.hmod"
sha256 = "bf05ad2348e0eb85300fdf6c81dd4d98003bdbb30e69369aee79e3574de49aa8"
changelog = """This version vetoes spawner spawns beside a lit feral lantern. The artefact has no spawner event of its own — the interaction is the light it writes — so the port implements vanilla's light limit as a pure rule and cancels through the stamped finalize_spawn hook, with a light read at the spawn cell. The first build false-failed fits because a SpawnSource::Block variant was read as a Block constructor; the rule now gates on the stamped spawn reason instead. Proven in game by a type-filtered spawn count falling from four to zero beside a lit lantern, with all pearl, spawn, drop and flare legs green and an inverted self-test exiting one."""

[[versions]]
version = "0.2.4"
published = "2026-11-24"
game = "26.3"
file = "torchmaster.hmod"
sha256 = "e894d0818a85c8101d13694cd49dbda94e119045eed3967869c405e3606ae3fb"
changelog = """This version adds the frozen pearl, which clears the torchmaster's residual invisible lights in a cube around the player and wears one charge per light removed. The artefact exposed an upstream defect: its config declares 1024 durability but the item never applies wear, so the shipped pearl is unbreakable; the port implements the stated behaviour and records the deviation that wear is written through equipment because the use-item site has no break result. Proven in game by three lights going to zero with damage rising to three of 1024, while a vanilla-lit cell 160 blocks away is untouched with damage unchanged. Four prior recipe families and three loot tables stay green."""

[[versions]]
version = "0.2.3"
published = "2026-11-24"
game = "26.3"
file = "torchmaster.hmod"
sha256 = "51042af1bcf1d087f6c0b11b048502df53ea10a3ea70663e9c5941c17d3ce6d8"
changelog = """This version adds the Feral Flare Lantern, which places invisible light blocks in a sphere of up to sixteen blocks every five ticks where the light is below ten. The reference's lifetime is tied to the lantern, not a timer: removing or replacing it removes its child lights. A cap off-by-one and a non-deterministic cell order were corrected while carrying the rule. Proven in game with seven lights around a placed lantern, none after it is broken, and none for a stone control; the inverted assertion fails at the seven it should not have seen."""

[[versions]]
