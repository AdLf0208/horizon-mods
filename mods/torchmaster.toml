game = "26.3"
file = "torchmaster.hmod"
sha256 = "d6f3d1f12a8c5f46bbc6205f039c1bfedb1b2c036b202ff1522c446163fcd4db"
changelog = """This version removes the package's one registry dependency, which the registry now refuses outright, and nothing observable is lost with it. The five log lines this port used to write went nowhere a player or a server owner could reach, so instead of replacing the logging crate the port grew a readout: a command lists every blocking light with its dimension and position, and a read or save problem is now printed beside it rather than whispered. Proven in game rather than argued: a sealed dark box spawns monsters with no light and none with a Mega Torch above it while the box's own light stays zero, a torch placed far outside the box leaves spawning untouched, and a Dread Lamp stops bats while seventy monsters keep spawning in the same box. Both carried recipes craft one and both loot tables drop one, with a vanilla control beside them. Two harness traps are recorded, including a passive-creature cap of zero that made the obvious lamp test vacuous."""

