changelog = """Carry-dialect repair: two recipes and two loot tables were in the 1.21.1 dialect. `megatorch` used the object ingredient form 26.3 rejects, so the mod's centrepiece could not be crafted, and both tables carried the array `"conditions"`, so the blocks dropped nothing. Converted. Proven in game: `megatorch` crafts with a diamond consumed and drops itself, while the pre-fix package failed both — `expected 1 torchmaster:megatorch, got None` and `dropped 0 of torchmaster:megatorch`."""

