changelog = """Slice 10, the sender module Mk2: the sender that needs a container chosen in advance and reaches twenty-four blocks, or forty-eight with range augments, rather than the four directions of the plain sender. Proven in game with four rigs whose differences are the whole claim: a selected chest ten blocks out takes all eight and the buffer empties, an identical module with no selection sends nothing, a target twenty-five blocks out sends nothing at the base reach of twenty-four, and one range up takes the reach to twenty-five and the items start moving one per operation. Both of the jar's recipes craft, one and four at a time, with the pearl consumed and a stick in its place producing nothing. One rule is carried but inert and is recorded as such rather than implied: the reference lets the sender's filter cap how many of an item the target may hold, and this port keeps the setting without acting on it.
