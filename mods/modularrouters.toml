changelog = """Slice 3, the registered module path: a module this port does not implement is now carried instead of destroyed. A router keeps the foreign id in its saved list, reports it, and leaves it alone on the tick, so a module from a mod this campaign never ported survives an install, a rewrite and a relaunch. The install path accepts either a module id this port knows or an item in the modules tag, and the refusal now names both. Proven in game with the old refusal quoted as the red: the shipped 0.2.2 package answers that only puller and sender modules may be installed and has already dropped the entry, while 0.2.3 keeps a foreign id written straight into the entity, shows it as two of nine, and never erases it. One platform limit is measured and recorded rather than worked around silently: a content mod loaded for development cannot add to another namespace's data, so the tag harness in the test world is a world data pack, and the port's own side stays independent of it."""

