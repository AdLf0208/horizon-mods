file = "actuallyadditions.hmod"
sha256 = "f7767ebadf65127b0f0d5b38d0152296051a49243d9b0c98251e54fbaadd1d67"
changelog = """This version makes the coal generator's own recipe craft: an iron casing, a basic coil and the cobblestones tag, so the recipe that had been carried since the second slice now resolves its keys instead of being dropped at load. Proven in game with the ingredients counted rather than the result alone: six cobblestone, two casings and a coal become one generator and the grid empties; a mossy cobblestone in the same cells still crafts, which shows the key is a tag rather than a single item, and stone in those cells crafts nothing, which shows the tag is not a wildcard; iron ingots where the casings go craft nothing. The crusher's own recipe remains refused with its reason, because the crystal it needs is grown rather than crafted, and a negative run asserts that the generator's recipe is unlocked so the check cannot pass by accident. One count in the brief was wrong and the artefact won: the grid is six cobblestone and nine items, not four and seven.
"""

[[versions]]
version = "0.2.3"
published = "2026-11-23"
game = "26.3"
file = "actuallyadditions.hmod"
sha256 = "e0b1f95ad260a2a8fc81ab0906cf902a42a11a07db3aae3161b8b21a88369600"
changelog = """This version answers a review rather than adding a family. The blocker was real: a broken machine's item carried the whole saved block entity, including its inventory, so a loaded crusher dropped its contents twice. The payload is now built from an allowlist of the four fields the machine actually restores, and it is attached only to the drop whose item is that machine. Proven in game by reading the dropped item's own components: it names the energy and the progress and no item list, the machine's input spills separately as the engine's job, and placing the item back restores the energy with an empty container. An empty machine's payload names nothing but its type, which is the differential. Two smaller review items are also fixed: the lock file its declared dependency needs is now packed, and the original licence text is the upstream file byte for byte, including the copyright line our previous version had rewritten.
"""

[[versions]]
version = "0.2.2"
published = "2026-11-21"
game = "26.3"
file = "actuallyadditions.hmod"
sha256 = "483f4e112a6277cdb7e49026a01e6bb4faeb69811614eeff64c6cde32fe253ad"
changelog = """Slice 2, a broken machine keeps its saved state: its energy, its burn and its burn maximum, and a crusher's progress. `block_drops` writes the block entity's saved compound onto the dropped item as `minecraft:block_entity_data` tagged with the entity type, and the block item clamps what vanilla restores on placement — the buffer to 60,000, the burn to its maximum, and a crusher's progress to 99 so a restored machine can never finish an operation on the tick it is placed. Proven in game: a generator broken at 1,800 FE and burning 1,510 of 1,600 comes back at 2,840 FE burning 1,458, while a harness-given machine reads 0 and burns 0; the counterfactual flips the assertion and exits 1. The operator-readout leg is also repaired: it was vacuous — `deop` cannot run in an integrated server, so the old grep matched the failed command's own refusal — and it is now a level-0 LAN-guest differential where `/help` and `/list` answer the same guest and the mod's readout is refused. Attempting the machine screen first was itself worth recording: a block-entity menu opens with zero slots in single player at this pin because `open_native_screen` is only called from the remote client's path, so the code was reverted and the gap recorded rather than shipping an empty window.
"""

