id = "mekanismtools"
kind = "mod"
name = "Mekanism: Tools"
summary = "72 Mekanism: Tools items \u2014 tools, paxels, armour and shields in six materials."
description = """
A port of [Mekanism: Tools](https://github.com/mekanism/Mekanism) by Aidan C. Brady and the Mekanism contributors
for Horizon: 72 tools, paxels, armour pieces and shields.

Implemented so far:
- 72 items: 30 tools (axe, hoe, pickaxe, shovel and sword in bronze, lapis lazuli,
  osmium, refined glowstone, refined obsidian and steel), 12 paxels, 24 armour pieces
  and 6 shields.
- The mod's own item models, 78 textures, equipment definitions, 65 recipes, the `c:`
  and `minecraft:` tool/armour tags and the language file.
- All 72 items are give-able, all 24 armour pieces equip into their own slot, and the
  creative tab lists every item.
- Paxels carry the pickaxe/axe/shovel rules of the three tools they replace.

Not yet ported:
- Attack damage is read from the item: the in-game check measures the steel sword at
  6.888 against a stick's 0.940, and the run passes.
- An item's harvest tier, durability and attack damage are the vanilla template's
  (iron/diamond/golden/netherite), not Mekanism's per-material numbers.
- `notes.md` and `VALIDATION.md` in the port record the deviations, the carry census and
  the verification table; the evidence logs are under `ports/_shared/evidence/mekanismtools/`.
- Shields use the vanilla shield template; upstream's own shield behaviour is not
  carried.

A data-tier carry: the 72-item census is a test-only Rust module (no injection). MIT — the original copyright and licence notices are kept in
the port repository (see LICENSE and LICENSE-NOTICE.md there). Pinned to
Horizon 1d63e0a and horizon-mixins 5a64af93.
"""
authors = ["Aidancbrady", "Thommy101", "Thiakil", "pupnewfster", "dizzyd", "AdLf0208"]
