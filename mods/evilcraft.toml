changelog = """This version applies the Blood Chest's curse roll, which the gap list said was recorded but never implemented. The artefact corrected my description twice: the draw is bounded so only roll zero curses, one in ten thousand, and the enchantment is chosen from the game's curse tag rather than hardcoded to vanishing — a binding curse is an equally valid result. Proven on the saved stack at the same chest and tool: roll zero leaves an enchantment at level one, roll nine thousand nine hundred and ninety-nine leaves only damage, with the same forty ticks and tank draw in both. The Colossal Chest's bulk repair path is deliberately untouched; it never curses upstream."""

