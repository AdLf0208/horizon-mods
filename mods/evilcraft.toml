sha256 = "a6632c3c555a9c9de1c7337ad4ce3b9bd0f08f5cf38470445d675c41f52790b8"
changelog = """Slice 4, projectile kills: an arrow kill now fills the blood extractor the player carries, which the melee-only hook never could. The credit rule is one listener on the death itself, so a melee kill cannot be filled twice and the existing melee phase remains the regression guard. Proven with three counterfactuals in one run: a twenty-health zombie killed with thirty-two arrows leaves the extractor at five hundred and forty-one of five thousand, the previous package's bytes at the same kill leave it at zero, and a zombie killed by a skeleton's arrow, whose owner was read back as that skeleton, leaves it at zero as well. The hook named in our brief did not work for this and the reason is measured rather than guessed: the death-loot hook does name the player for a bow kill, but a write to the player's inventory made there is discarded, so the fill moved to the death hook where the write lands. A second engine fact came with it: a player switched from survival to creative stops keeping a death hook's inventory write, so the kill phases run in survival and the numbers say why, two hundred and sixty-six in creative from launch, five hundred and ninety-eight in survival, and zero after the switch."""

