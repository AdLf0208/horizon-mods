changelog = """This version adds the two undead-tree Blood Infuser recipes. The artefact corrected the brief twice: the sapling infuses at tier zero, not tier three, and the planks recipe is tier two in the jar. Both data files are carried byte for byte — a dead bush becomes an undead sapling for 800 mB over 200 ticks, and undead planks become reinforced planks for 1,000 mB over 250 ticks. The recipe count rises from ten to twelve in game, both inputs work at their declared tier and the planks stay inert at tier zero, with an inverted self-test ending exit one. All 34 earlier e2e legs and the full recipe table remain green."""

