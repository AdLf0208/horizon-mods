changelog = """This version carries the undead wood set: logs, stripped logs, wood, planks, stairs, slab, fence, gate, leaves and sapling, with the jar's own seven crafting recipes and tags. The artefacts were enumerated from the jar rather than from the brief, and the reinforced planks were not duplicated because an earlier slice already carries them. Proven in game on both halves: each new id gives and places with its declared state and an unknown id is refused, and all seven recipes craft their exact output with the grid emptied and the input consumed. The tree's worldgen file is inert at this pin and is recorded as such, not dressed up as a behaviour."""

