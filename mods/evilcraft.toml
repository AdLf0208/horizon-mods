changelog = """Slice 5, the blood stain: the block the extractor fills from, a small tank that a crouching click drains into the extractor the player carries and that vanishes when emptied. Proven with the numbers the mechanic needs rather than an outcome: a stain seeded to three and a half thousand pours exactly the one thousand the extractor had room for and stops there, the same click standing still moves nothing, so does the same click on stone, and a stain at four hundred drains to nothing and the block becomes air. Two facts are recorded that only a real game could produce. The replaceable tag cannot be expressed at this pin, because it is a per-state block fact with no key in the property set, so a block placed onto a stain lands above it and the tag is inert; it is carried as the jar ships it and the assertion flips if a later pin reads it. And the harness cannot aim at a one pixel block by its centre, because the aim is at the cell middle which is above the shape, so a stain is aimed within its shape and clicked with the raw mouse action instead."""

