changelog = """This version adds the Vengeance Pickaxe and the immunity that gives it a purpose: the Purifier refuses to strip a curse from that item, while the same curse on a vanilla pickaxe is removed for a bucket of blood. The gap line said the item was missing and the dispatch guessed a damage hook; the artefact disagrees on both counts and the source settles it — the guard is in the Purifier's curse action, with no entity or damage query involved. Proved on the saved item itself: after a hundred and forty ticks the enchanted pickaxe still carries vanishing curse and its tank stays full, while a diamond pickaxe in the same machine loses the curse and a thousand millibuckets. The item's own crafting recipe stays a gap because its ingredients are not carried."""

