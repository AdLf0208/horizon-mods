sha256 = "d203fad4d2fc96fb574724ae4688fc7d39448eb1517558023e1aab06f26b4e78"
changelog = """This version makes the carried tanks answer a comparator, using the same cache-and-notify route the power cells proved: the machine's tick records its tank fraction, and a change nudges the neighbours rather than the hook trying to read a block entity it cannot see. The fraction is the reference's ceiling of fifteen times the stored amount over capacity, which is why two thousand of three thousand reads ten and one thousand eight hundred reads nine — the brief's nine at two thousand was arithmetic error, and the artefact settled it. Proven at the game's own consumer: a full purifier drives a wire at fifteen, a stone control at zero, and the inverted assertion fails at the ten it should have produced."""

