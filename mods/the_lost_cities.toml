changelog = """This version decodes a second city part, the six-slice building, from the jar's private schema. Reading the artefact caught details the brief omitted: an extra char and two palette entries resolved through the style and variant files, so the decoder now handles variant and from-palette forms as well as multi-layer bounds. Two parts are decoded, at different heights, leaving the other 206 blocked rather than claimed. Proven by authoring four bookshelves in the modded dimension where vanilla noise fills none, with the street's 136 slabs still present and an inverted selftest ending exit one."""

