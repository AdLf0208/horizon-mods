changelog = """This version decodes the horizontal rail line, the third part, from the jar's private schema and lays it below the street and building. The brief's palette ids were wrong again — the artefact maps e to east-west rails and f to powered rails — so all twelve entries were carried verbatim and the correction recorded. Proven in game by filling forty-eight rail blocks in the modded dimension where vanilla noise fills none, with a shaped-state differential and an inverted self-test ending exit one. Three parts are decoded; the other two hundred and five remain blocked rather than claimed."""

