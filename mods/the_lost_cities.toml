changelog = """This version decodes the first descent, the seventh part, with two palette entries copied verbatim from the jar's default palette — iron bars and a bottom stone slab. Iron bars are placed by no other decoded part, giving a clean in-game differential; thirty bars were authored in the modded dimension where vanilla noise writes none, with an inverted self-test ending exit one. The part sits above the street to avoid the lower descent, and the other two hundred and one parts remain blocked rather than claimed."""

