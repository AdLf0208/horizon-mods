id = "the_lost_cities"
kind = "native-mod"
name = "the_lost_cities"
summary = "A Horizon port of the_lost_cities."
description = """
A port of [the_lost_cities](https://github.com/McJtyMods/LostCities) by McJty.

The first port of The Lost Cities for Horizon 26.3. The jar's cities are Java-generated, so this version carries what the pin can express honestly: the `lostcities:lostcity` dimension registered from the jar's own values, six block tags, language, and both chest loot tables. Both loot tables shipped a bare `type: item` that 26.3 cannot decode — an in-game probe dropped zero items — so the carry rewrites that one field and both tables now drop three to four. Proven in game with a control game where the dimension is unknown, a tag that matches bedrock, and a SELFTEST that inverts each assertion. The city generator, its private parts/buildings/palettes schema and the two Java feature types remain blocked at this pin and are recorded rather than faked.
"""
