changelog = """Slice 5, the machine addon system: six addon blocks that now change the machines they sit beside, with speed, efficiency, processing and burst rules read from the config's own default rather than from a guess. That default is the additive mode, which makes a speed addon two thirds rather than a half, and so the pulverizer finishes in sixty-seven ticks for three thousand eight hundred and eighty-six FE rather than the fifty ticks a multiplicative reading would give; both branches are implemented and tested because the config value selects between them. Proven in game by priming each leg with exactly the operation's whole cost, so a cheaper tick would leave energy behind and a dearer one would starve mid-progress: a speed addon gives sixty-seven ticks and three thousand eight hundred and eighty-six where the same machine without one takes a hundred and three thousand two hundred, an efficiency addon costs two thousand seven hundred, a capacitor takes the buffer from twenty-five thousand to two million and twenty-five thousand and clamps back when the addon is broken, a burst addon crafts two hundred and forty items in thirteen ticks for four hundred and sixteen, and a processing addon turns two bones into twelve bone meal for four thousand eight hundred. The furnace, the chiller and the lava generator each show their own tick and cost with the same addon, and all six new blocks drop themselves."""

