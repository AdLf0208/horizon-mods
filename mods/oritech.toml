changelog = """Slice 3, the industrial chiller: Oritech's first fluid machine, and the one machine in its line whose whole process is vanilla, water to three ice and lava to two obsidian. Everything else would have consumed dusts and clumps this port does not carry, so its recipes could never match and shipping them would be dead data. The numbers are the jar's: fifty thousand FE of buffer, thirty-two a tick, a four thousand millibucket tank, one bucket a craft, two hundred ticks, with the core offset this port already learned for its other multiblock. Proven in game by measurement rather than by reading the readout: three hundred and twenty FE advanced the craft exactly ten ticks, and a hundred and forty-four ticks spent exactly four thousand six hundred and eight, leaving three ice and an empty tank; lava gave two obsidian for exactly six thousand four hundred; a steam fluid was refused with an accepted count of zero. The cold-biome speed and efficiency bonus is recorded as blocked because the mod API has no biome read at this pin, rather than being approximated."""

