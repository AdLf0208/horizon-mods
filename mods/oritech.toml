changelog = """Slice 9, the centrifuge: a machine with an item side and a fluid side, where the fluid half only works once a fluid addon sits in one of its slots. What the slice actually buys is a chain rather than a block: the pulverizer now makes coal dust from any coal, the centrifuge turns that dust into carbon fibre strands, and eight strands plus redstone make the third machine core this port's machines need to be built at all, so the machine that produces the ingredient for the machines is now itself buildable. The fluid half runs a clay recipe from water and dirt once the addon is fitted, and a recipe with a fluid output is refused at load rather than shipped as data that eats its input and gives nothing. Proven in game with the arithmetic: one operation spends exactly its time multiplied by the rate and produces the counted output, a wrong-ratio input produces nothing and spends nothing, and the whole scenario is unknown to a game without the package. Fifty of the jar's ninety-two centrifuge files are refused, each with a reason: another mod, a mod item nothing here consumes, or a fluid output this package cannot store.
"""

