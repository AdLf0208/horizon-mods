changelog = """Slice 4, the lava generator: a machine that burns one hundred millibuckets of lava over a hundred and twenty ticks for exactly sixty-four FE a tick, then hands everything it made to the ten blocks around it. It reuses the chiller's tank and fluid command and the assembly pattern the other machines already use. Proven in game with a fail-capable counterpart for each claim: a hundred millibuckets enters through the block's own declared handler and nothing burns until the core is in place; the burn reads exactly two thousand eight hundred and sixteen at seventy-six ticks, which is forty-four times sixty-four, and ends at exactly seven thousand six hundred and eighty with the tank empty; the push hands all of it to an adjacent pulverizer, which spends exactly three thousand two hundred on a bone; and an unassembled generator keeps its five thousand while its neighbour stays put, then re-assembly moves all five thousand over. An empty tank and a tank of water each make nothing for two hundred ticks. The last of those caught a bug in this port's own first draft: the energy push sat outside the assembly gate, so an unassembled controller would still have pushed stored energy, which upstream's tick prevents by returning early. It is fixed, and the differential that exposed it is now a permanent leg."""

