file = "oritech.hmod"
sha256 = "df078ef68690cb78c92bbc4d66f53524a01a9ebe73b18a9dd948b6ce42b72aa8"
changelog = """Slice 7, the material and component chain: the recipes the machines needed, so a generator, a pulverizer, a furnace, a chiller and a lava generator are now craftable instead of given. The selection rule is the interesting part and it is mechanical: a recipe is carried only if its result and every ingredient resolve inside this package or in the engine, which over the jar's nine hundred and sixty-five recipe files leaves exactly twenty and eighteen are carried, the other two being alternates of carried ones. Seventeen craft in a real table in game, each asserting the result's id and count, that the result reaches the inventory, and that every ingredient's count fell by exactly what it used, with a wrong grid making nothing and a selftest flipping a count. A smelting recipe completes in exactly thirty ticks for exactly nine hundred and sixty FE. One boundary is recorded rather than faked: the nickel and platinum ingots come from ores, and a content package's configured features never reach the feature registry at this pin, so the ore files are not carried and the two ingots stay give-only until that changes. The remaining nine hundred and forty-five recipes are each left with a reason, from machine recipes of machines this port has not built to compatibility recipes naming other mods' items."""

