description = """Dynamic Trees for Horizon, slice 1: the oak. An oak acorn planted on soil
grows through named stages over time — sprout, trunk, branches, canopy — into a tree whose
trunk, branches and leaves are placed progressively and whose growth resumes after a
relaunch. Every other species, the tree-pack API, the dendro pouch and the cell-kit solver are
out of this slice.

**Implemented so far:** the slice in the package, as described above.

**Not yet ported**

- Every other species (acacia, birch, cherry, dark oak, jungle, mangrove, spruce, crimson,
- The **tree-pack API** (com/dtteam/dynamictrees/api/**, treepack/) — Java interfaces and
- The **cell-kit solver** (systems/cell, worldgen/JoCode, GrowthLogicKits): the real
- The **dendro pouch**, the **Woodland Staff**, the **dendro potions**, the **dirt bucket**,
- **Worldgen**: worldgen/configured_feature/dynamic_tree.json and the NeoForge biome
- **Rooty soil**: upstream converts the soil under a sapling to dynamictrees:rooty_dirt

Ported to Horizon 0.2 from the upstream mod; pinned to game 26.3, Horizon SDK `0b14f8a` and horizon-mixins `e59da90`. The full corresponding source ships in this repository beside the artifact."""
