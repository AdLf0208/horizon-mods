changelog = """
This version answers a review. The package now declares the parent it binds to, with the reason and the link, and the proof is a refusal rather than an assurance: installed alone, the loader stops before compiling anything and names both mods, repeating the declaration's own reason and address; installed with the parent, both packages compile and the machine leg passes. Three behaviour defects are fixed with them. The pipe network was walked in full by every pipe every tick, with a linear membership test at each neighbour, so a large network cost work that grew faster than it; it is now set-based, walked once per tick per component, cached for the tick and bounded. A second lens no longer consumes the new item and voids the seated one: the swap reserves a destination first and refuses the click when there is none, because a full inventory is not permission to destroy one. And a broken machine now carries its lens and its augment on its own item and restores them, while an empty machine's item carries nothing. The original notice is the upstream text verbatim, including the second copyright holder our first archive had dropped.
"""
