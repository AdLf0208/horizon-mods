changelog = """Slice 6, the two ladders completed: six more furnator tiers and six more cable tiers, so the furnator now runs from eighty FE a tick to forty thousand and the cable from two thousand to a million. Proven by reading every one of the fourteen numbers in game rather than by trusting the table: each furnator clamps at its own buffer under a request for far more than it can hold, each cable names its own rate in its readout, and the difference is observable through the blocks they feed, where a cell behind a starter cable takes five hundred a tick and the same cell behind a basic one takes a thousand. The nitro furnator is the one worth quoting, because its buffer was given exactly room for one coal so the read can be checked against the fuel rather than the machine: carbon reads eight thousand, not forty-seven thousand nine hundred and eighty. All eighteen new recipes craft with their exact outputs and ingredients consumed, and all twelve new blocks drop themselves. A selftest that demands the old rate fails, and the whole scenario on a game without the package fails at the first placement. Reactors stay recorded as blocked, because their fuel has no source in this pack at all."""

