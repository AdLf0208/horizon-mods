sha256 = "8cf04f34e5135e4e07a66a516c42da11c2841e82f82458d63b3ae29a480269d3"
changelog = """Slice 7, item energy: a machine broken in survival now carries its buffer on its own item and gives it back when placed, and a machine with a charge slot moves energy into the items you put there. Our brief named a symbol that does not exist at this pin and a capacitor that is not chargeable; the artefact corrected both, and the mechanism is the item energy capability, with the machine block items themselves being what charge. Proven in game with the numbers the differential needs: a furnator broken at five thousand places back at five thousand, a doctored item naming two billion clamps to the tier, a plain item places empty, and a cell carries its four thousand. The charge rate is measured against the game's own clock rather than a sleep: six ticks moved four hundred and eighty FE at eighty a tick with the machine losing exactly what the item gained, then the balance arm left the machine at zero with forty on the item, and the room arm stopped at a full item with nine hundred and twenty left over. Two defects in the reference are recorded rather than copied: it keeps an item's charge in one field while the placement reads a different one, so a machine charged in a slot used to give the placed machine nothing, and it believes a saved payload as written and per stack, which is how a two billion FE item was accepted."""

