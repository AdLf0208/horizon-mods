description = """A port of Integrated Crafting for Horizon: a Crafting Interface block that accepts crafting jobs,
resolves each against the game's own crafting recipes, keeps the recipe for the job's life, holds the
ingredients in its own slots, and crafts one recipe at a time. The network it attaches to upstream
(Integrated Dynamics' crafting network) is not ported, so the interface works standalone: ingredients
come from its own slots and its results stay in its output slots.

**Implemented so far:** the slice in the package, as described above.

**Not yet ported**

- **blocked(no-parent-network-attachment-api)** — the network half: a part on
- **blocked(no-variable-card-layer)** — the Crafting Writer part and every aspect the mod ships
- **The part screens** — upstream has five containers and their screens
- **The job dependency graph** — a job whose ingredient is itself craftable
- **Priorities, distributed jobs over several interfaces, several crafting CPUs, blocking-mode
- **The bound machine** — inserting the inputs into the block the interface faces through the item

Ported to Horizon 0.2 from the upstream mod; pinned to game 26.3, Horizon SDK `0b14f8a` and horizon-mixins `e59da90`. The full corresponding source ships in this repository beside the artifact."""
