id = "betteradvancedtooltips"
kind = "native-mod"
name = "Better Advanced Tooltips"
summary = "A Horizon port of betteradvancedtooltips."
description = """
A port of [betteradvancedtooltips](https://github.com/latvian-dev/better-advanced-tooltips) by latvian-dev.

A first port of Better Advanced Tooltips for Horizon 26.3. The client gate passed with a readable oracle — tooltip lines, exact modifier keys, burn time and a parsed command reply — so the fuel and component families are proved in game: coal reports sixteen hundred ticks, eighty seconds and eight items, a diamond sword reports its custom-name component, and a non-fuel or unknown id emits nothing. The tag family is blocked because the pin can test membership of a named tag but cannot enumerate an item's tags; no list was invented. The font glyphs are render-only and not carried.
"""
