changelog = """Slice 2, the mode family: all eight building-gadget modes and their selection, where the port was fixed to one. `build_to_me` is now the default as upstream has it, and `vertical_wall`, `vertical_column`, `surface`, `horizontal_wall`, `stairs`, `horizontal_row` and `grid` each come from their own upstream class, with two quirks kept and pinned by tests: `horizontal_wall`'s centre-cell column gate and `stairs`' own sign rule. `/buildinggadgets2 mode` and `placeontop` store beside range and selection. Proven in game: every mode's phase asserts the exact cell set and one stone consumed per cell, the mode, range and placeontop replies are read from the parsed action bar, the carried recipe crafts with its ingredients consumed and a wrong-ingredient control matching nothing, and the control game refuses the gadget. Anchor, undo, energy, preview, the bound inventory and the GUI stay recorded gaps rather than being half-built."""

