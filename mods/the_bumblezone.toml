id = "the_bumblezone"
kind = "native-mod"
name = "the_bumblezone"
summary = "A Horizon port of the_bumblezone."
description = """
A port of [the_bumblezone](https://github.com/TelepathicGrunt/Bumblezone) by TelepathicGrunt.

The first port of The Bumblezone for Horizon 26.3. A correction was made before any code: the jar ships LGPL-3.0 for code and an All-Rights-Reserved asset licence, which beat the mods.toml MIT declaration under the campaign's licence ruling. The port therefore regenerates all of its art — a proven zero jar-derived asset bytes — ships the LGPL text and a monogram icon, and credits TelepathicGrunt. This version registers the mod's dimension, chunk generator and biome source from the jar's own values; in game the modded dimension accepts blocks and answers its ids while an unmodded control reports an unknown dimension. The ten biome definitions and feature data remain blocked at this pin (no configured-feature registrar, no terrain reset) and are recorded rather than faked.
"""
