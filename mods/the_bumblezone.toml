id = "the_bumblezone"
kind = "native-mod"
name = "The Bumblezone"
summary = "A Horizon port of the_bumblezone."
description = """
A port of [the_bumblezone](https://github.com/TelepathicGrunt/Bumblezone) by TelepathicGrunt.

The first port of The Bumblezone for Horizon 26.3. A correction was made before any code: the jar ships LGPL-3.0 for code and an All-Rights-Reserved asset licence, which beat the mods.toml MIT declaration under the campaign's licence ruling. The port therefore regenerates all of its art — a proven zero jar-derived asset bytes — ships the LGPL text and a monogram icon, and credits TelepathicGrunt. This version registers the mod's dimension, chunk generator and biome source from the jar's own values; in game the modded dimension accepts blocks and answers its ids while an unmodded control reports an unknown dimension. The nine biome definitions, seven layer families and their mob-spawner lists are carried from value contracts with zero jar-derived asset bytes. Configured features and carvers remain blocked at this pin (no configured-feature registrar, no terrain reset) and are recorded rather than faked.
"""
authors = ["TelepathicGrunt, AdLf0208"]
owners = ["AdLf0208"]
owner_ids = [107615167]
license = "LGPL-3.0-only"
source = "https://github.com/AdLf0208/the_bumblezone"
icon = "icons/the_bumblezone.png"
categories = ["utility"]
tags = ["port", "horizon"]

