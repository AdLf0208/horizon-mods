changelog = """This version carries the nine biomes' mob spawner lists: sixty-five entries from the jar translated into the 26.3 natural-mob-spawns overlay, with the values authored from a contract and zero jar-derived asset bytes. The decoder was measured before any data edit, so the feature is real rather than stand-in data. Proven in game by a parsed readout naming creature and monster weights for hive_pillar, while the unmodded game reports an unknown command and the inverted self-test exits one. A command-argument mismatch was found and fixed in glue — the pin delivers a free id as a string, not an id value. Configured features and carvers remain blocked at this pin."""

