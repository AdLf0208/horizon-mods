id = "gamma"
kind = "native-mod"
name = "Gamma"
summary = "Ultra-lightweight Gamma toggle between 100% and 1500%."
description = """
Ultra-lightweight native Gamma mod for Horizon that toggles brightness between 100% and 1500%.

- Press **G** (rebindable in **Options > Controls**) to toggle between 100% and 1500% gamma with a brief status message.
- Can also be toggled in **Options > Mods > Gamma**.
- Respects Horizon's external-server fullbright restriction (`fullbright_held`): leaves normal vanilla brightness intact on external servers and LAN guest sessions while staying active in singleplayer, hosted LAN worlds, and Replay Studio.
- Performs zero allocations on idle frames and updates settings and renderer state only when the gamma state changes.
- Pinned to Horizon Nightly `2026-11-20` (`0a875da91dbb0fdcb7ba8c42c11341aa229af51a`) and `horizon-mixins` `e59da9094f0c2fdda6c627fe9eff22dec6a906f0`.
"""
