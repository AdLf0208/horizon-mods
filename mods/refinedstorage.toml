sha256 = "3223f32ae80773769dd4a5b3ac1dc350477d7608778131223a6ba43e93bb6bb9"
changelog = """
Slice 7, the importer and the exporter: two machines that move items between a network and the block they face, with filters and with the speed and stack upgrades finally doing something after being refused for two slices. Proven as a differential on the same source over the same twenty ticks: three items with no upgrade, sixty-four in one pass with a stack upgrade, eighty-eight with four speed upgrades, and the readout naming the work interval falling from nine ticks to one; the filter lets its named item through and leaves another in the same source, while the exporter moves exactly the four items its filter names and a filterless one moves nothing. The machines open a thirteen slot menu and refuse a diamond in the upgrade row, and both break and drop themselves. Two defects were fixed on the way. The port's directional placement was mirrored, writing the clicked face where the reference writes its opposite, so a transmitter placed on a cable faced away and was offline; that is one line for all three directional blocks and the earlier assertion now reads south for a click on a north face. And the four new recipes were first written in the older object shape, which the pin drops silently, so the first run failed all four and their controls together.
"""

