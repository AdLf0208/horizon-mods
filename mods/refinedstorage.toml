file = "refinedstorage.hmod"
sha256 = "e1c84b64a7804fdbce737ba63ed0b860840c140a43f5da26dbc2262b6c3f9ac4"
changelog = """
This version adds the other storage disks and the parts they are made from, so a drive can hold four sizes of disk instead of one, and gives the creative disk the semantics its name hides: it reports no capacity at all, refuses nothing, and keeps accepting past every other disk's ceiling, which the leg proves by taking the same deposit the 64k just refused. The boundaries are read rather than assumed: a saved component fuller than its disk is cut to the disk's own room, the next deposit is refused with the count unchanged over twenty ticks and the item recoverable, and the drive reads two disks with different capacities before and after a save and relaunch. The brief said three new items and the jar names parts as well, so the faithful set is four disks and three parts, and the recipes were taken from the jar rather than invented. One port defect fell out of the leg: the drive marked every disk dirty every tick and rewrote each one, so an external component edit was reverted within a tick and the first fill vanished.
"""

