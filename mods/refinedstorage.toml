sha256 = "92858557af7dcf5bd4c88ce4f43a62fc666605c099bc373cfa8a4baa390cc21f"
changelog = """
This version answers the second review round with three data-integrity fixes and one authorization fix. A machine item carries its saved contents, and the previous build wrote them onto the stack that placed it — so placing one of two and keeping the second left the first machine's contents on the survivor. Survival now leaves the hand alone entirely, because the engine takes the placed unit after the hook, and creative strips only when the placed unit was the whole stack. A disk inserted into a drive is now one transaction: the slot write and the hand's decrement commit together or neither happens, and the decrement comes from the hand that clicked. Breaking a machine no longer takes its upgrades; the take happens at the completion gate, and a break that hands nothing over leaves the engine's usual spill alone, with the slots riding the item only when the item is actually in the drop list. Both mutating commands are operator-only and re-check permission in their own bodies, and a charge is applied only after the server's copy of the held stack proves it is the wireless grid. Proven in game: a stack of two places one and the survivor keeps its payload, a creative break spills four speed upgrades and one stack upgrade as five item entities while carrying nothing, a level-zero guest is refused both commands, and a stick in the main hand charges nothing.
"""

