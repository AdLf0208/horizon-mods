changelog = """This version applies the already-proved filter to the quarry path as well. The artefact's two filter sites collapse to one call in this port because drops are inserted directly: a denied block stays in place with no drops rolled and costs the same fifty FE skip. Proven in game with eighteen denied stone cells and nine allowed dirt cells — the status shows nine quarried and eighteen skipped, the energy line shows 3,600 FE spent, and the chest holds only dirt; a filterless quarry on the same rig collects all twenty-seven. The earlier shaped, quarry, void, energy and chunk-load numbers stay green."""

