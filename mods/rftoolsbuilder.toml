changelog = """This version gives the builder the quarry card, which was the one card type with no geometry of its own: it uses the card's box and replaces what it breaks. Six of them are carried, because the jar's are not one card but six — plain, silk, fortune, and the same three in a clearing form — and the difference between them is a drop rule rather than a shape. The void list is carried too, with the jar's own seven keys and its tags, and the replacement block is authored per builder because that is where the jar keeps it. Proven on a three-by-three-by-three volume with every count read back: twenty-seven cells quarried, two voided, twenty-five cobblestone collected and no gravel or coarse dirt, the card still carrying its type and void list after being taken and put back, the replacement block written into every cell when asked, the clearing form emptying them, silk giving twenty-seven stone instead of cobble, fortune turning the gravel into flint, and a box card on the same rig collecting nothing. One defect is fixed rather than copied: a block flagged as unbreakable handed out its drops while staying in place, which the port now refuses."""

