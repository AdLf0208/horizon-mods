changelog = """This version adds the pump and liquid cards plus the builder's fluid tank. The BE-fluid capability was confirmed at the pin before any code, and the artefact's whole-bucket rule was carried: one source cell becomes exactly one thousand millibuckets at three hundred FE per cell, with no partial fills. Proven in game by pumping twenty-seven water sources into twenty-seven thousand millibuckets with all cells left as air, draining them back with the liquid card, and a quarry differential collecting no fluid. Every prior selftest and control leg was re-run on the final bytes."""

