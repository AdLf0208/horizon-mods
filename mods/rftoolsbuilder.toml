sha256 = "b647bc0a80cc03265d886e78cbec0617b7a63cb20f2a63f3da29bd5df31dcefc"
changelog = """This version makes the quarry hold its chunk instead of stalling when the builder's box lies outside loaded chunks. The ticket lifecycle is read from the reference: force a chunk when a pass begins on an unloaded one, reuse it when the box stays in the same chunk, and release it when the pass finishes or the machine is removed. An upstream defect was fixed rather than copied — the shipped bytecode passes false where the ticket should be added, so the port uses the intended true. Proven on a never-visited chunk: the forced-chunk list shows the ticket during the pass, all twenty-seven cells are quarried, the corner reads the replacement block, and the list is empty afterwards; a second rig in another unvisited chunk repeats it."""

