changelog = """Slice 2, the two carried recipes, which were dead data: the builder and its shape card both used the 1.21.1 `{"item": …}` / `{"tag": …}` ingredient form, which 26.3 rejects at load, so the game logged `invalid ingredient` for every key and the grid sat full with an empty result — the mod could not be crafted at all. Both files now use bare item ids and `#tag` strings, with patterns, results and ids untouched, and the port gains a data guard that fails on the old shape. Proven in game: the shape card and the builder both craft with their ingredients consumed and the grid emptied, two wrong-ingredient controls return nothing, the game log has no `invalid ingredient` line, and a broken builder drops itself once."""

