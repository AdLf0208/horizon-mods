id = "create"
kind = "native-mod"
name = "Create"
summary = "A Horizon port of create."
description = """
A port of [Create](https://github.com/Creators-of-Create/Create) by The Create Team.

A first port of Create for Horizon 26.3, carrying the interop surface dependent add-ons need. The jar was inventoried first and only the ids a viable dependent names were carried — a creative motor, the two alloy metals and sheets, one recipe, one loot table and one tag — with every asset regenerated and a proven zero jar-derived byte count. The motor publishes its own saved speed, capacity, zero stress and running status through a parsed ctl readout, with a vanilla-block refusal and an inverted self-test; the alloy grid recipe consumes exactly its inputs. The kinetics engine, contraptions, Ponder and trains remain out of scope for this pin.
"""
authors = ["The Create Team", "AdLf0208"]
owners = ["Delete228"]
owner_ids = [31237303]
license = "MIT"
source = "https://github.com/AdLf0208/create"
icon = "icons/create.png"
categories = ["utility"]
tags = ["port", "horizon"]

[[versions]]
version = "0.1.1"
published = "2026-11-24"
game = "26.3"
file = "create.hmod"
sha256 = "bec224ec6802c113b0082bbbce78627f523770005333455ebb523f09c2a41b90"
changelog = """This version adds the kinetics engine. The artefact's graph rules were carried clean-room: block ids map to nodes, rotation propagates along the facing axis, stress is the sum of consumer impacts scaled by speed, and every node publishes the solved state into its own NBT so an add-on can read a neighbour without a symbol link. The pin's tick event cannot read neighbours, so the solve runs on the network query path; that limitation is recorded, not faked. Proven in game by a motor, shaft and press reading speed sixteen, stress eight and running, an unconnected shaft reading idle, and an inverted self-test ending exit one."""

