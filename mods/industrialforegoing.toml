file = "industrialforegoing.hmod"
sha256 = "28eef176332c277538d8fc5d23bf60aac8eb226407b6a5895cfa47cbd9618826"
changelog = """
This version adds the animal rancher, which milked its first cow into a tank this package had never filled. The brief had it wrong in an interesting way and the artefact won: there is no input slot and no milk bucket anywhere in the machine, because it puts a bucket in a fake player's hand, calls the animal, drains the milk into its own tank and empties the hand, while a sheep's wool goes to its container. So the numbers are the machine's own: a cow gives exactly a thousand millibuckets of milk for four hundred energy, a red sheep gives its wool once and then nothing, no animal spends nothing with the bar resting full, and a machine with three hundred and ninety-nine energy leaves the cow alone. It also proves the output container's limits and its draw count, and a broken machine carries both its charge and its milk on its item. Two harness bugs were fixed rather than worked around: the crafting helper could not place two non-stackable items, and the pinned draw was being spent on the next tick rather than the next attempt.
"""

[[versions]]
version = "0.2.11"
published = "2026-11-23"
game = "26.3"
file = "industrialforegoing.hmod"
sha256 = "f7154dc52f6c9a343a11d5b757b1c674bb924c92ba199f2d73a1ccc91fa962ad"
changelog = """
This version adds the mob duplicator and the imprisonment tool that feeds it, so essence now has a use: twelve millibuckets for each point of a mob's health buys a copy, which for a cow is a hundred and twenty. The config was read from the code rather than its comments and the comments are wrong twice, once about the energy per operation and once about the principle, so the leg asserts the numbers the code uses. Proven in game on all the cases: a cow in the box costs five thousand energy and a hundred and twenty essence and leaves a second cow, an empty essence tank spawns nothing and spends no energy, and a box already at the nearby cap spawns nothing while holding both its charge and its essence. The tool captures and releases a cow, and a broken machine carries its energy and its essence on the item. One harness fact cost a run and is worth keeping: the game's own entity-cramming rule kills a crowd before a cap can be tested, so the cap leg raises that rule and restores it afterwards.
"""

[[versions]]
version = "0.2.10"
published = "2026-11-23"
game = "26.3"
file = "industrialforegoing.hmod"
sha256 = "c759203e51229549e63fb4b113c76950e661576d3053472fa5e69dc5e627f4d4"
changelog = """
This version adds the mob crusher, which is the first machine that turns a mob into essence as well as loot, and it gave the last declared fluid in this package its source. The brief's rule for that number was wrong and the artefact won: there is no essence per point of health, the reference fills the tank with twenty millibuckets for each experience point the killed mob would have given, and the engine's own count is printed beside it, so a cow worth one point gives twenty and the leg asserts twenty times a number it reads rather than a number it assumes. The kill is made through a fake player so the experience event and the loot table both fire, and the drops go into the machine's own output container while the world's are cancelled. Proven in game on all the cases that matter: a cow dies, one leather and two beef land in the output, the tank gains twenty and the buffer fifty, the same box with no mob spends nothing at all, the same cow with no energy stays alive, a hopper empties the output into a barrel, and a broken machine returns its charge and its essence. The config values were read from the code rather than its comments, which differ in one place.
"""

