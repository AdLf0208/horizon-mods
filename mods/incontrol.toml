description = """Spawn and loot control driven by two JSON rule files a pack author edits by hand:
config/incontrol/spawn.json denies a fresh mob by id, mod, dimension, height or block/sky light,
and config/incontrol/loot.json removes, replaces or adds the drops of a mob or a block. Rules are
ordered, first match wins unless a rule says "continue", /incontrol reload re-reads both files and
/incontrol status prints what is in force. Summon-aid, area, phase, finalize and despawn rules are
not ported yet.

**Implemented so far**

- **Rule file**: config/incontrol/spawn.json (upstream's path,
- **Conditions** (all must match, GenericRuleEvaluator.java:1402-1409):
- when: position (default; natural spawn attempts only) or onjoin
- mob: one entity id or a list (OR); bare ids gain minecraft:.
- mod: one namespace or a list (OR).
- dimension: one dimension id or a list (OR); bare ids gain minecraft:.

**Not yet ported:** see the repository's notes for the recorded gaps.

Ported to Horizon 0.2 from the upstream mod; pinned to game 26.3, Horizon SDK `0b14f8a` and horizon-mixins `e59da90`. The full corresponding source ships in this repository beside the artifact."""
