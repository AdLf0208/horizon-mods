changelog = """First publication, with the review repairs. Spirit fire, its datura ignition rule and the 18 chalk colours, with the jar's models, recipes and loot. `/occultism info` is now a level-2 command **with** a body re-check, and a position holding no spirit fire answers only that it is not one — the readout no longer doubles as a world probe. A spectator's click changes nothing: the hook checks the player's game mode before recolouring, lighting a fire or consuming datura, and fails closed on an unknown mode. The conversion ring is bounded and keyed per world and dimension."""

